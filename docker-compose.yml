services:
  mysql:
    image: mysql:8.4
    container_name: lens-mysql
    environment:
      MYSQL_DATABASE: lens_hrms
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: lens-spring-hrms
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lens_hrms
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-development-secret-key-at-least-32-chars}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  mysql_data:
