spring.application.name=lens-spring-hrms

# MySQL - use environment variables; never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lens_hrms}
spring.datasource.username={DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# JWT - set APP_JWT_SECRET in the environment in real deployments.
app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# Demo users are disabled by default.
app.seed-demo-users=${SEED_DEMO_USERS:true}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.lens.hrms=INFO
logging.level.org.springframework.security=INFO
